<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 390" role="img" aria-label="Describe tasks and access; Dagger schedules across processors">
<title>Describe tasks and access; Dagger schedules across processors</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#adbdc9"/></marker></defs>
<text x="30" y="35" fill="#adbdc9" font-size="17" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="start">YOUR PROGRAM</text>
<rect x="30" y="80" width="265" height="90" rx="14" fill="#182530" stroke="#73e2bd" stroke-width="1.5"/>
<text x="162.5" y="124.0" fill="#73e2bd" font-size="25" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="middle">Function calls</text>
<text x="162.5" y="155.0" fill="#adbdc9" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="middle">tasks</text>
<rect x="30" y="220" width="265" height="90" rx="14" fill="#182530" stroke="#b8a0f5" stroke-width="1.5"/>
<text x="162.5" y="264.0" fill="#b8a0f5" font-size="25" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="middle">Data access</text>
<text x="162.5" y="295.0" fill="#adbdc9" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="middle">reads + writes</text>
<line x1="300" y1="125" x2="420" y2="185" stroke="#415b6b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="300" y1="265" x2="420" y2="205" stroke="#415b6b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="430" y="135" width="250" height="120" rx="14" fill="#182530" stroke="#73e2bd" stroke-width="1.5"/>
<text x="555.0" y="194.0" fill="#73e2bd" font-size="32" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="middle">Dagger</text>
<text x="555.0" y="225.0" fill="#adbdc9" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="middle">schedule + move data</text>
<text x="820" y="35" fill="#adbdc9" font-size="17" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="start">AVAILABLE PROCESSORS</text>
<line x1="686" y1="195" x2="805" y2="109" stroke="#415b6b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="815" y="65" width="275" height="88" rx="14" fill="#182530" stroke="#73e2bd" stroke-width="1.5"/>
<text x="952.5" y="108.0" fill="#73e2bd" font-size="25" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="middle">CPU threads</text>
<text x="952.5" y="139.0" fill="#adbdc9" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="middle">within a process</text>
<line x1="686" y1="195" x2="805" y2="219" stroke="#415b6b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="815" y="175" width="275" height="88" rx="14" fill="#182530" stroke="#b8a0f5" stroke-width="1.5"/>
<text x="952.5" y="218.0" fill="#b8a0f5" font-size="25" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="middle">GPU devices</text>
<text x="952.5" y="249.0" fill="#adbdc9" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="middle">one or more per node</text>
<line x1="686" y1="195" x2="805" y2="329" stroke="#415b6b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="815" y="285" width="275" height="88" rx="14" fill="#182530" stroke="#ffc184" stroke-width="1.5"/>
<text x="952.5" y="328.0" fill="#ffc184" font-size="25" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="middle">MPI ranks</text>
<text x="952.5" y="359.0" fill="#adbdc9" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="middle">within one node</text>
</svg>
