<text x="1079.5" y="255.5" fill="#adbdc9" font-size="24" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="middle">22</text>
<line x1="912" y1="185.0" x2="1122" y2="185.0" stroke="#415b6b" stroke-width="1.5"/>
<path d="M1077.5 140.5 Q 1075.0 185.0, 970.5 229.5" fill="none" stroke="#b8a0f5" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="1015.0" y="372" fill="#edf3f5" font-size="17" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="middle">u = ruᵀ: the next j is this i</text>
<text x="590" y="418" fill="#adbdc9" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="middle">Calling the same half step twice is one ADI time step.</text>
