<text x="900" y="106" fill="#edf3f5" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="start">a 3 × 3 window</text>
<text x="900" y="150" fill="#adbdc9" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="start">Wrap(): periodic</text>
<text x="900" y="176" fill="#edf3f5" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="start">also Pad, Reflect,</text>
<text x="900" y="202" fill="#edf3f5" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="start">Clamp, ...</text>
<text x="900" y="246" fill="#adbdc9" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="start">One task per tile;</text>
