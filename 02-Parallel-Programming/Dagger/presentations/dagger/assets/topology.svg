<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 350" role="img" aria-label="One Julia process splits one matrix product across two GPUs on one node">
<title>One Julia process splits one matrix product across two GPUs on one node</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#adbdc9"/></marker></defs>
<rect x="15" y="15" width="1090" height="295" rx="14" fill="#182530" stroke="#415b6b" stroke-width="1.5"/>
<text x="45" y="50" fill="#adbdc9" font-size="19" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="start">ONE SERVER / ONE JULIA PROCESS / TWO GPU DEVICES</text>
<rect x="80" y="80" width="180" height="60" rx="14" fill="#182530" stroke="#73e2bd" stroke-width="1.5"/>
<text x="170.0" y="118.0" fill="#73e2bd" font-size="25" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="middle">A₁</text>
<rect x="470" y="80" width="180" height="60" rx="14" fill="#182530" stroke="#ffc184" stroke-width="1.5"/>
<text x="560.0" y="118.0" fill="#ffc184" font-size="23" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="middle">Shared B</text>
<rect x="860" y="80" width="180" height="60" rx="14" fill="#182530" stroke="#73e2bd" stroke-width="1.5"/>
<text x="950.0" y="118.0" fill="#73e2bd" font-size="25" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="middle">A₂</text>
<line x1="170" y1="145" x2="240" y2="195" stroke="#415b6b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="950" y1="145" x2="880" y2="195" stroke="#415b6b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="530" y1="145" x2="360" y2="195" stroke="#415b6b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="590" y1="145" x2="760" y2="195" stroke="#415b6b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="85" y="205" width="360" height="85" rx="14" fill="#182530" stroke="#b8a0f5" stroke-width="1.5"/>
<text x="265.0" y="246.5" fill="#b8a0f5" font-size="28" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="middle">GPU 1</text>
<text x="265.0" y="277.5" fill="#adbdc9" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="middle">C₁ = A₁ × B</text>
<rect x="675" y="205" width="360" height="85" rx="14" fill="#182530" stroke="#b8a0f5" stroke-width="1.5"/>
<text x="855.0" y="246.5" fill="#b8a0f5" font-size="28" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="middle">GPU 2</text>
<text x="855.0" y="277.5" fill="#adbdc9" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="middle">C₂ = A₂ × B</text>
<text x="560" y="340" fill="#edf3f5" font-size="23" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="middle">One output matrix: C = [ C₁ ; C₂ ] = A × B</text>
</svg>
