<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" role="img" aria-label="Step k equals 2 of a five by five tiled Cholesky: column 1 is finished; POTRF factors tile 2,2; TRSM solves tiles 3,2 to 5,2; SYRK updates diagonal tiles 3,3 to 5,5; GEMM updates tiles 4,3, 5,3 and 5,4. GEMM of tile 5,3 reads tiles 5,2 and 3,2.">
