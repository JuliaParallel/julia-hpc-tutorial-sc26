<text x="1077.5" y="338" fill="#adbdc9" font-size="17" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="middle">panel 2</text>
<line x1="305" y1="185.0" x2="445" y2="185.0" stroke="#415b6b" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="730" y1="185.0" x2="870" y2="185.0" stroke="#415b6b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="116.0" y="160" width="30" height="30" rx="4" fill="#182530" stroke="#73e2bd" stroke-width="2.5"/>
