<rect x="169.0" y="60" width="121.0" height="250" rx="8" fill="#182530" stroke="#415b6b" stroke-width="1.5"/>
<text x="102.5" y="338" fill="#adbdc9" font-size="17" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="middle">panel 1</text>
<text x="227.5" y="338" fill="#adbdc9" font-size="17" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="middle">panel 2</text>
<text x="590.0" y="38" fill="#ffc184" font-size="22" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="middle">(b) Cholesky solves</text>
<rect x="465" y="60" width="121.0" height="250" rx="8" fill="#182530" stroke="#415b6b" stroke-width="1.5"/>
<rect x="594.0" y="60" width="121.0" height="250" rx="8" fill="#182530" stroke="#415b6b" stroke-width="1.5"/>
<text x="527.5" y="338" fill="#adbdc9" font-size="17" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="middle">panel 1</text>
<text x="652.5" y="338" fill="#adbdc9" font-size="17" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="middle">panel 2</text>
<text x="1015.0" y="38" fill="#b8a0f5" font-size="22" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="middle">(c) transpose</text>
<rect x="890" y="60" width="121.0" height="250" rx="8" fill="#182530" stroke="#415b6b" stroke-width="1.5"/>
