<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" role="img" aria-label="One ADI time step on the n by n grid of u. First half step: the explicit part u times L couples neighbours along y, then every column is solved with the Cholesky factor, n independent solves. Second half step: the explicit part L times u couples neighbours along x, then every row is solved, again n independent solves.">
<title>One ADI time step on the n by n grid of u. First half step: the explicit part u times L couples neighbours along y, then every column is solved with the Cholesky factor, n independent solves. Second half step: the explicit part L times u couples neighbours along x, then every row is solved, again n independent solves.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#adbdc9"/></marker></defs>
<text x="280.0" y="40" fill="#73e2bd" font-size="24" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="middle">first half step</text>
<text x="280.0" y="72" fill="#adbdc9" font-size="19" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="middle">explicit: u · L (along y)</text>
<rect x="150" y="92" width="260" height="260" rx="10" fill="#182530" stroke="#415b6b" stroke-width="1.5"/>
<text x="900.0" y="40" fill="#ffc184" font-size="24" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="middle">second half step</text>
<text x="900.0" y="72" fill="#adbdc9" font-size="19" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="middle">explicit: L · u (along x)</text>
<rect x="770" y="92" width="260" height="260" rx="10" fill="#182530" stroke="#415b6b" stroke-width="1.5"/>
<line x1="170" y1="108" x2="170" y2="336" stroke="#73e2bd" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="201" y1="108" x2="201" y2="336" stroke="#73e2bd" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="232" y1="108" x2="232" y2="336" stroke="#73e2bd" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="263" y1="108" x2="263" y2="336" stroke="#73e2bd" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="294" y1="108" x2="294" y2="336" stroke="#73e2bd" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="325" y1="108" x2="325" y2="336" stroke="#73e2bd" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="356" y1="108" x2="356" y2="336" stroke="#73e2bd" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="387" y1="108" x2="387" y2="336" stroke="#73e2bd" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="786" y1="112" x2="1014" y2="112" stroke="#ffc184" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="786" y1="143" x2="1014" y2="143" stroke="#ffc184" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="786" y1="174" x2="1014" y2="174" stroke="#ffc184" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="786" y1="205" x2="1014" y2="205" stroke="#ffc184" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="786" y1="236" x2="1014" y2="236" stroke="#ffc184" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="786" y1="267" x2="1014" y2="267" stroke="#ffc184" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="786" y1="298" x2="1014" y2="298" stroke="#ffc184" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="786" y1="329" x2="1014" y2="329" stroke="#ffc184" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="280.0" y="388" fill="#edf3f5" font-size="20" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="middle">implicit along x: every column</text>
<text x="280.0" y="416" fill="#73e2bd" font-size="20" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="middle">u[:, j] = Fu \ ru[:, j]</text>
<text x="900.0" y="388" fill="#edf3f5" font-size="20" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="middle">implicit along y: every row</text>
<text x="900.0" y="416" fill="#ffc184" font-size="20" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="middle">u[i, :] = Fu \ ru[i, :]</text>
<line x1="450" y1="222.0" x2="730" y2="222.0" stroke="#415b6b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="590" y="206.0" fill="#adbdc9" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="middle">all columns done</text>
<text x="590" y="256.0" fill="#adbdc9" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="middle">then the rows</text>
</svg>
