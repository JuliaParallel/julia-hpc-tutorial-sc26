<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" role="img" aria-label="One half step of the final exercise on u split into two panels of whole columns. First a stencil computes the explicit terms along j, reading across the panel edge and wrapping at the outer edges. Then every panel&#x27;s columns are solved with the Cholesky factor, one task per panel. Then the blocks are transposed into u, so the next half step treats the other direction implicitly.">
<title>One half step of the final exercise on u split into two panels of whole columns. First a stencil computes the explicit terms along j, reading across the panel edge and wrapping at the outer edges. Then every panel&#x27;s columns are solved with the Cholesky factor, one task per panel. Then the blocks are transposed into u, so the next half step treats the other direction implicitly.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#adbdc9"/></marker></defs>
