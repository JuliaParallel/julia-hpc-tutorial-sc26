<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 480" role="img" aria-label="An eight by eight array in four tiles. The three by three neighbourhood of a point next to a tile edge includes one column from the next tile, the halo that Dagger copies. At the outer edge Wrap reads the opposite side. On the right, the window is indexed nb[1,1] to nb[3,3], with nb[2,2] the point itself.">
<title>An eight by eight array in four tiles. The three by three neighbourhood of a point next to a tile edge includes one column from the next tile, the halo that Dagger copies. At the outer edge Wrap reads the opposite side. On the right, the window is indexed nb[1,1] to nb[3,3], with nb[2,2] the point itself.</title>
