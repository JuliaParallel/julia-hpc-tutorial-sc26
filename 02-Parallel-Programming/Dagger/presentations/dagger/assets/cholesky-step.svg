<text x="46" y="432" fill="#8abdea" font-size="17" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="start">G(5,3) reads S(5,2) and S(3,2)</text>
<rect x="470" y="58" width="50" height="50" rx="9" fill="#182530" stroke="#73e2bd" stroke-width="1.5"/>
<text x="495" y="93" fill="#73e2bd" font-size="26" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="middle">P</text>
<text x="545" y="79" fill="#edf3f5" font-size="22" font-family="DejaVu Sans Mono, monospace">T[k,k] = chol(T[k,k])</text>
<text x="545" y="106" fill="#adbdc9" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="start">factor the diagonal tile</text>
<rect x="470" y="150" width="50" height="50" rx="9" fill="#182530" stroke="#b8a0f5" stroke-width="1.5"/>
<text x="495" y="185" fill="#b8a0f5" font-size="26" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="middle">S</text>
<text x="545" y="171" fill="#edf3f5" font-size="22" font-family="DejaVu Sans Mono, monospace">T[m,k] = T[m,k] / T[k,k]&#x27;</text>
<text x="545" y="198" fill="#adbdc9" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="start">each tile below it: reads T[k,k]</text>
<rect x="470" y="242" width="50" height="50" rx="9" fill="#182530" stroke="#ffc184" stroke-width="1.5"/>
<text x="495" y="277" fill="#ffc184" font-size="26" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="middle">U</text>
<text x="545" y="263" fill="#edf3f5" font-size="22" font-family="DejaVu Sans Mono, monospace">T[n,n] -= T[n,k] * T[n,k]&#x27;</text>
<text x="545" y="290" fill="#adbdc9" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="start">each later diagonal tile: reads T[n,k]</text>
<rect x="470" y="334" width="50" height="50" rx="9" fill="#182530" stroke="#8abdea" stroke-width="1.5"/>
<text x="495" y="369" fill="#8abdea" font-size="26" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="middle">G</text>
<text x="545" y="355" fill="#edf3f5" font-size="22" font-family="DejaVu Sans Mono, monospace">T[m,n] -= T[m,k] * T[n,k]&#x27;</text>
<text x="545" y="382" fill="#adbdc9" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="start">each tile below that: reads T[m,k], T[n,k]</text>
<text x="470" y="448" fill="#adbdc9" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="start">L = finished columns of the factor. Step k + 1 works on column k + 1.</text>
