<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" role="img" aria-label="One GPU is faster than eight GPUs in the 16384 rehearsal sample">
<title>One GPU is faster than eight GPUs in the 16384 rehearsal sample</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#adbdc9"/></marker></defs>
<text x="20" y="27" fill="#adbdc9" font-size="22" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="start">N = 16,384    /    tile = 2,048    /    elapsed seconds ↓ lower is better</text>
<text x="20" y="118" fill="#73e2bd" font-size="29" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="start">1 GPU</text>
<rect x="210" y="80" width="369.22245" height="57" rx="8" fill="#73e2bd" stroke="#73e2bd" stroke-width="1.5"/>
<text x="599.22245" y="119" fill="#73e2bd" font-size="31" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="start">0.214 s</text>
<text x="20" y="224" fill="#b8a0f5" font-size="29" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="start">8 GPUs</text>
<rect x="210" y="186" width="612.55095" height="57" rx="8" fill="#b8a0f5" stroke="#b8a0f5" stroke-width="1.5"/>
<text x="842.55095" y="225" fill="#b8a0f5" font-size="31" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="start">0.355 s</text>
</svg>
