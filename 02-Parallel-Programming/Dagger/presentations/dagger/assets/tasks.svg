<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 390" role="img" aria-label="Two independent producers feed multiply, then sum">
<title>Two independent producers feed multiply, then sum</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#adbdc9"/></marker></defs>
<rect x="15" y="20" width="155" height="80" rx="14" fill="#182530" stroke="#73e2bd" stroke-width="1.5"/>
<text x="92.5" y="59.0" fill="#73e2bd" font-size="25" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="middle">a</text>
<text x="92.5" y="90.0" fill="#adbdc9" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="middle">rand</text>
<rect x="245" y="20" width="155" height="80" rx="14" fill="#182530" stroke="#73e2bd" stroke-width="1.5"/>
<text x="322.5" y="59.0" fill="#73e2bd" font-size="25" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="middle">b</text>
<text x="322.5" y="90.0" fill="#adbdc9" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="middle">rand</text>
<line x1="92" y1="105" x2="183" y2="170" stroke="#415b6b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="322" y1="105" x2="232" y2="170" stroke="#415b6b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="120" y="180" width="175" height="75" rx="14" fill="#182530" stroke="#b8a0f5" stroke-width="1.5"/>
<text x="207.5" y="225.5" fill="#b8a0f5" font-size="25" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="middle">c = a × b</text>
<line x1="207" y1="262" x2="207" y2="305" stroke="#415b6b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="120" y="315" width="175" height="65" rx="14" fill="#182530" stroke="#ffc184" stroke-width="1.5"/>
<text x="207.5" y="355.5" fill="#ffc184" font-size="23" font-family="DejaVu Sans, sans-serif" font-weight="600" text-anchor="middle">d = sum(c)</text>
